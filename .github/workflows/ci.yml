# Pull-request gate for main. The whole tree is formatted. Every validate root in
# scripts/tf-inventory.json is initialised without a backend and validated, and
# every test root is also tested, all with the normal Terraform version. The
# workflow configures no Azure credentials and never applies or destroys
# infrastructure: live runs are separate and opt-in.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    name: Read the shared root inventory
    runs-on: ubuntu-latest
    outputs:
      validate_roots: ${{ steps.inventory.outputs.validate_roots }}
      test_roots: ${{ steps.inventory.outputs.test_roots }}
      terraform_version: ${{ steps.inventory.outputs.terraform_version }}
    steps:
      - uses: actions/checkout@v4
      - id: inventory
        shell: bash
        run: |
          echo "validate_roots=$(jq -c '{root: .groups.validate_roots}' scripts/tf-inventory.json)" >> "$GITHUB_OUTPUT"
          echo "test_roots=$(jq -c '{root: .groups.test_roots}' scripts/tf-inventory.json)" >> "$GITHUB_OUTPUT"
          echo "terraform_version=$(jq -r '.versions.terraform_normal' scripts/tf-inventory.json)" >> "$GITHUB_OUTPUT"

  format:
    name: Terraform formatting
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.prepare.outputs.terraform_version }}
      - run: terraform fmt -check -diff -recursive .

  validate:
    name: Validate (${{ matrix.root }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.validate_roots) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.prepare.outputs.terraform_version }}
      - run: terraform -chdir="${{ matrix.root }}" init -backend=false -input=false -no-color
      - run: terraform -chdir="${{ matrix.root }}" validate -no-color

  test:
    name: Test (${{ matrix.root }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.test_roots) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.prepare.outputs.terraform_version }}
      - run: terraform -chdir="${{ matrix.root }}" init -backend=false -input=false -no-color
      - run: terraform -chdir="${{ matrix.root }}" test -no-color

  gates:
    name: Documentation and repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public documentation, links and the package inventory
        run: python scripts/repository_gate.py
      # A bare git diff --check compares the working tree with the index, which are
      # equal in a fresh checkout, so it can never fail. This step checks the commits
      # that the pull request or push adds. When the base is unknown (a new branch, an
      # all-zero before SHA, or an old head removed by a force push), the empty tree
      # makes every committed line subject to the check, so the whole tree is checked.
      - name: Check whitespace in the commits under review
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD

  # Single required status for branch protection: green only when every job
  # above succeeded, so matrix entries can change without editing the rule.
  complete:
    name: ci complete
    needs: [format, validate, test, gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gate job succeeded
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
